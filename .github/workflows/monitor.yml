name: 微博监控

on:
  schedule:
    # GitHub 用 UTC 时间。下面代表 UTC 0点到18点（即北京 8点到次日凌晨2点）每5分钟运行一次，完美避开你要求的凌晨3-7点。
    - cron: '*/5 0-18 * * *'
  workflow_dispatch: # 允许你手动点击运行测试

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 恢复历史记录（wbIds.txt），防止每次重复推送老微博
      - name: 恢复历史记录
        uses: actions/cache@v4
        with:
          path: wbIds.txt
          key: wbids-cache-${{ github.run_id }}
          restore-keys: |
            wbids-cache-

      # 2. 安装 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 安装依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 运行监控脚本
      - name: 运行监控
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
        run: |
          echo "=========== 开始体检 ==========="
          python -c "import os; print('1. Token读取:', '成功' if os.environ.get('WXPUSHER_APP_TOKEN') else '失败(为空)')"
          python -c "import os; print('2. UID读取:', '成功' if os.environ.get('WXPUSHER_UID') else '失败(为空)')"
          python -c "import os; print('3. Cookie读取:', '成功' if os.environ.get('WEIBO_COOKIE') else '失败(为空)')"
          echo "=========== 开始执行 ==========="
          python start.py

      # 5. 保存最新的历史记录
      - name: 保存历史记录
        uses: actions/cache@v4
        with:
          path: wbIds.txt
          key: wbids-cache-${{ github.run_id }}
